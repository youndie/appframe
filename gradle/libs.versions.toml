[versions]
# The build conventions: the coordinate, the version, the toolchain, the jvm floor, the style and the
# test platform. Bumping this changes how both modules are built.
sborka = "0.4.0.111"
# The compiler comes with them. The `wip` catalog a sborka release publishes carries `kotlin`,
# `ksp` and `composeMultiplatform`, and those three are one decision, not three: KSP is built
# against a compiler, the Compose plugin is versioned by it, and a Compose Multiplatform release
# is built against a plugin range. Holding any of them here would be that decision spelled twice.
kotlinx-coroutines = "1.11.0"
# One version ref covers both the Gradle plugin and the artifacts it adds: the plugin defaults them
# to its own version, which is what keeps the KSP processor and the capture engine in step.
viddik = "0.7.1.53"

[libraries]
kotlinx-coroutines-swing = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }

[plugins]
viddik = { id = "io.github.youndie.viddik", version.ref = "viddik" }
sborkaKmp = { id = "io.github.youndie.sborka.kmp", version.ref = "sborka" }
sborkaLint = { id = "io.github.youndie.sborka.lint", version.ref = "sborka" }
sborkaPublish = { id = "io.github.youndie.sborka.publish", version.ref = "sborka" }
