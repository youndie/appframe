name: Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      # Java and Gradle in one step and at one version for the portfolio. What the modules compile
      # to is `sborka.jvmToolchain=21`, fetched by the toolchain resolver.
      - name: Setup Java and Gradle
        uses: youndie/sborka/.github/actions/setup-kotlin@main
      - name: Test
        run: ./gradlew :appframe:desktopTest --no-daemon
      - name: Publish
        run: ./gradlew appframe:publishDesktopPublicationToKotlinWebsiteRepository -PVERSION=0.1.${{github.run_number}} -PkotlinWebsiteUsername=${{secrets.REPOSILITE_USER}} -PkotlinWebsitePassword=${{secrets.REPOSILITE_PASSWORD}} --no-daemon
