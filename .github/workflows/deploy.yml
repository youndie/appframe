name: Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      # Java and Gradle in one step and at one version for the portfolio. The action installs 21 and
      # 25: the modules compile ON sborka's default toolchain (25) and TO `sborka.jvmFloor=21`.
      - name: Setup Java and Gradle
        uses: youndie/sborka/.github/actions/setup-kotlin@main
      - name: Test
        run: ./gradlew :appframe:desktopTest --no-daemon
      - name: Publish
        run: ./gradlew appframe:publishDesktopPublicationToKotlinWebsiteRepository -PVERSION=0.2.0.${{github.run_number}} -PkotlinWebsiteUsername=${{secrets.REPOSILITE_USER}} -PkotlinWebsitePassword=${{secrets.REPOSILITE_PASSWORD}} --no-daemon
