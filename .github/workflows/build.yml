name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      # Screenshot verification is part of `check`: the fixtures draw in viddik's bundled font, so
      # the goldens are the same on every runner and there is nothing host-specific left to skip.
      - name: Build and test
        run: ./gradlew build --stacktrace

      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-diffs-${{ matrix.os }}
          path: appframe/build/reports/screenshots/*.png
          if-no-files-found: ignore
          retention-days: 7
