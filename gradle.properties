#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2048M
#Gradle
org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.configuration-cache=true
org.gradle.caching=true

# WHAT THE SHARED CONVENTIONS READ (`io.github.youndie.sborka`).
#
# The group is the published coordinate's, and it is set here rather than per module: a group written
# once per module is how six modules of another repository were published under a group derived from
# a directory name.
sborka.group=io.github.youndie
sborka.repository=youndie/appframe
sborka.description=Platform-aware window frame for Compose Multiplatform desktop applications.
sborka.inceptionYear=2025

# The version, and one number rather than two. CI passes the full one through `-PVERSION`; this is
# what a local build and `publishToMavenLocal` use. It replaces `-PBUILD_NUMBER`, which reached only
# the publication's coordinates while the archive tasks kept naming files after the project version.
#
# THE HEAD NAMES THE NEXT RELEASE, and moves as soon as one is out. `deploy.yml` reads it through
# sborka's `determine-version` and publishes every push to `main` as `<head>.<run number>`; a release
# goes to Maven Central as the plain number, from its tag (sborka's `central.yaml`, `-PVERSION=X.Y.Z`).
#
# In Maven's ordering `X.Y.Z.N` sorts ABOVE `X.Y.Z`. Left at `0.2.0` after 0.2.0 was released, the
# builds that followed went out as `0.2.0.28`–`0.2.0.30`: named after a release they came after, and
# sorting above it as if they were its newer copies. `0.2.1.<run>` is a build on the way to the next
# release, which is what it is.
version=0.2.1

# 21, which is what this library is compiled to. The floor is also STATED in the published metadata:
# a multiplatform module publishes its jvm variant with no `org.gradle.jvm.version` at all, so a
# consumer on 17 resolved this library, compiled against it and met UnsupportedClassVersionError at
# class loading — a message about a bytecode version with nothing in it about appframe. Since sborka
# 0.4.0.111 it also decides the class library the code compiles against (`-Xjdk-release=21`).
#
# The toolchain is not written here: it is sborka's default (25), the JDK the compiler and the tests
# run on, which nothing a consumer receives depends on.
sborka.jvmFloor=21

# MAVEN CENTRAL. `io.github.youndie.sborka.publish` reads this and applies the plugin that adds the
# javadoc jar and the signatures the portal requires; sborka's `central.yaml` refuses a tree without it.
sborka.central=true
