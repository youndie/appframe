#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2048M
#Gradle
org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.configuration-cache=true
org.gradle.caching=true

# WHAT THE SHARED CONVENTIONS READ (`ru.workinprogress.sborka`).
#
# The group is the published coordinate's, and it is set here rather than per module: a group written
# once per module is how six modules of another repository were published under a group derived from
# a directory name.
sborka.group=io.github.youndie
sborka.repository=youndie/appframe
sborka.description=Platform-aware window frame for Compose Multiplatform desktop applications.
sborka.inceptionYear=2025

# The version, and one number rather than two. CI passes the full one through `-PVERSION`; this is
# what a local build and `publishToMavenLocal` use. It replaces `-PBUILD_NUMBER`, which reached only
# the publication's coordinates while the archive tasks kept naming files after the project version.
#
# THE HEAD IS ALSO IN `deploy.yml`, as `0.1.<run number>`. One number in two files: they move
# together, or a release goes out under a head nobody chose.
version=0.1.0-snapshot

# 21 for both, which is what this library is compiled to. The floor is now also STATED in the
# published metadata: a multiplatform module publishes its jvm variant with no
# `org.gradle.jvm.version` at all, so a consumer on 17 resolved this library, compiled against it and
# met UnsupportedClassVersionError at class loading — a message about a bytecode version with nothing
# in it about appframe.
sborka.jvmToolchain=21
sborka.jvmFloor=21

